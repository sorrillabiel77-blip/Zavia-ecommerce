# Render > New > Blueprint. Usa serviço WEB Python + PostgreSQL.
# Não usar New > Static Site nesta versão.
services:
  - type: web
    name: zavia-loja
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn zavia.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zavia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: '0'
      - key: PYTHONUNBUFFERED
        value: '1'
databases:
  - name: zavia-db
    plan: free
